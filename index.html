<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Saahil's Food Log</title>
<style>
  :root{
    --bg:#0f1115; --card:#171a21; --card2:#1d212a; --line:#272c36;
    --text:#e7eaf0; --muted:#8b93a3; --faint:#5b6472;
    --green:#4ade80; --green-dim:#22613f; --red:#f87171; --red-dim:#5c2626;
    --blue:#60a5fa; --blue-dim:#274668; --amber:#fbbf24; --amber-dim:#5a4415;
    --track:#232833;
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
  body{
    font-family:-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
    background:var(--bg); color:var(--text); line-height:1.45;
    padding:18px 14px 120px; max-width:720px; margin:0 auto;
  }
  h1{font-size:22px;font-weight:800;letter-spacing:-.2px;}
  .sub{color:var(--muted);font-size:13px;margin-top:3px;}
  .sub b{color:var(--text);font-weight:700;}

  .section-label{font-size:11px;text-transform:uppercase;letter-spacing:.14em;color:var(--faint);font-weight:800;margin:26px 4px 12px;}

  /* weekly bars */
  .weekwrap{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px 12px 10px;}
  .weekrow{display:flex;gap:6px;align-items:flex-end;height:120px;}
  .wcol{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;position:relative;}
  .wbar{width:74%;border-radius:6px 6px 3px 3px;min-height:4px;transition:height .3s;}
  .wval{font-size:10px;color:var(--muted);margin-bottom:4px;font-variant-numeric:tabular-nums;}
  .wlbl{font-size:10px;color:var(--faint);margin-top:6px;white-space:nowrap;}
  .wcaption{font-size:11px;color:var(--faint);margin:2px 4px 12px;}

  /* day card */
  .day{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:14px;}
  .dhead{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:12px;}
  .dtitle{font-size:16px;font-weight:800;}
  .dtag{font-size:11px;color:var(--muted);background:var(--card2);border:1px solid var(--line);padding:2px 9px;border-radius:999px;margin-top:5px;display:inline-block;}
  .kcal-big{font-size:19px;font-weight:800;text-align:right;white-space:nowrap;}
  .kcal-big small{color:var(--muted);font-weight:600;font-size:13px;}

  .meters{display:flex;flex-direction:column;gap:9px;margin:4px 0 14px;}
  .meter .mtop{display:flex;justify-content:space-between;font-size:12px;margin-bottom:4px;}
  .meter .mtop .lbl{color:var(--muted);}
  .meter .mtop .val{font-variant-numeric:tabular-nums;font-weight:700;}
  .bar{height:7px;border-radius:5px;background:var(--track);overflow:hidden;}
  .fill{height:100%;border-radius:5px;transition:width .3s;}
  .ok{color:var(--green);} .over{color:var(--red);}
  .fill.g{background:var(--green);} .fill.b{background:var(--blue);} .fill.r{background:var(--red);} .fill.a{background:var(--amber);}
  .bar.stack{display:flex;position:relative;}
  .seg{height:100%;transition:width .3s;}
  .seg.r{background:var(--red);} .seg.g{background:var(--green);}
  .satmark{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--amber);border-radius:2px;}

  .fatline{display:flex;gap:14px;font-size:11.5px;color:var(--muted);margin:-6px 0 12px;}
  .fatline b{color:var(--text);}
  .dot{display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:5px;vertical-align:middle;}

  .items{border-top:1px solid var(--line);}
  .item{display:flex;justify-content:space-between;gap:10px;padding:9px 0;border-bottom:1px solid var(--line);font-size:13px;}
  .item:last-child{border-bottom:none;}
  .iname .m{font-size:10px;text-transform:uppercase;letter-spacing:.06em;color:var(--faint);font-weight:700;}
  .iname .n{color:var(--text);}
  .imac{text-align:right;white-space:nowrap;color:var(--muted);font-variant-numeric:tabular-nums;font-size:12px;}
  .imac b{color:var(--text);}
  .idel{color:var(--faint);font-size:11px;cursor:pointer;margin-left:8px;}

  .drow{display:flex;gap:9px;margin-top:14px;}
  .btn{flex:1;text-align:center;border:1px solid var(--line);background:var(--card2);color:var(--text);
    padding:11px;border-radius:11px;font-size:13px;font-weight:700;cursor:pointer;}
  .btn.sync{background:var(--green-dim);border-color:#2e7d54;color:#c9f5db;}
  .btn:active{opacity:.7;}

  /* add button */
  .fab{position:fixed;left:50%;transform:translateX(-50%);bottom:22px;z-index:40;
    background:var(--blue);color:#06263f;font-weight:800;font-size:15px;border:none;
    padding:14px 26px;border-radius:999px;box-shadow:0 8px 24px rgba(0,0,0,.5);cursor:pointer;}
  .fab:active{opacity:.85;}

  /* modal */
  .modal{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;align-items:flex-end;justify-content:center;z-index:50;}
  .modal.open{display:flex;}
  .sheet{background:var(--card);border:1px solid var(--line);border-radius:18px 18px 0 0;width:100%;max-width:720px;padding:20px 18px 30px;max-height:90vh;overflow:auto;}
  .sheet h3{font-size:16px;margin-bottom:14px;}
  label{display:block;font-size:12px;color:var(--muted);margin:12px 0 5px;}
  input,select{width:100%;background:var(--bg);border:1px solid var(--line);color:var(--text);
    padding:11px;border-radius:10px;font-size:14px;}
  .grid3{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
  .macpreview{font-size:12px;color:var(--muted);margin-top:12px;}
  .mrow{display:flex;gap:10px;margin-top:18px;}
  .toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:#0b3b26;border:1px solid #2e7d54;
    color:#c9f5db;padding:11px 16px;border-radius:11px;font-size:13px;z-index:60;display:none;max-width:90%;text-align:center;}
  .toast.show{display:block;}
  .src{font-size:11px;color:var(--faint);text-align:center;margin-top:18px;}
</style>
</head>
<body>

  <h1>Saahil's Food Log</h1>
  <div class="sub" id="targetline"></div>

  <div class="section-label">This week</div>
  <div class="weekwrap">
    <div class="wcaption">Calories &nbsp;(<span style="color:var(--green)">under</span> / <span style="color:var(--red)">over</span> target)</div>
    <div class="weekrow" id="wk-cal"></div>
    <div class="wcaption" style="margin-top:14px;">Protein &nbsp;(<span style="color:var(--blue)">vs</span> 150g floor)</div>
    <div class="weekrow" id="wk-pro"></div>
  </div>

  <div class="section-label">Days</div>
  <div id="days"></div>

  <div class="src" id="srcline"></div>

  <button class="fab" onclick="openAdd()">+ Add food</button>

  <!-- add modal -->
  <div class="modal" id="modal">
    <div class="sheet">
      <h3>Add a food</h3>
      <label>Day</label>
      <select id="f_day"></select>
      <label>Meal</label>
      <select id="f_meal">
        <option>Breakfast</option><option>Lunch</option><option>Snack</option>
        <option>Dinner</option><option>Early morning</option><option>Drink</option>
      </select>
      <label>What did you eat?</label>
      <input id="f_name" placeholder="e.g. Clear whey 30g in water">
      <div class="grid3">
        <div><label>Calories (kcal)</label><input id="f_kcal" type="number" inputmode="numeric" placeholder="0"></div>
        <div><label>Protein (g)</label><input id="f_pro" type="number" inputmode="decimal" placeholder="0"></div>
        <div><label>Total fat (g)</label><input id="f_fat" type="number" inputmode="decimal" placeholder="0"></div>
        <div><label>Saturated fat (g)</label><input id="f_sat" type="number" inputmode="decimal" placeholder="0"></div>
      </div>
      <div class="macpreview">Tip: log the macros I work out for you in chat. Unsaturated is filled in automatically as total minus saturated.</div>
      <div class="mrow">
        <button class="btn" onclick="closeAdd()">Cancel</button>
        <button class="btn sync" onclick="saveFood()">Save</button>
      </div>
    </div>
  </div>

  <div class="toast" id="toast"></div>

<script>
// ---------- embedded fallback seed (used if data.json cannot be fetched) ----------
const SEED = {
  "targets": { "kcal": 1900, "protein": 150, "fat": 60, "sat": 15 },
  "updated": "2026-07-29",
  "days": [
    {"date":"2026-07-24","label":"Fri 24 Jul","workout":"Push","items":[
      {"meal":"Breakfast","name":"Morning shake (vanilla whey, oat milk, nuts, berries)","kcal":367,"protein":29,"fat":15,"sat":2.5},
      {"meal":"Lunch","name":"Chicken curry 255g + ghee roti","kcal":475,"protein":38,"fat":23,"sat":7},
      {"meal":"Snack","name":"Evening shake + nuts/seeds","kcal":180,"protein":26,"fat":7,"sat":1.5},
      {"meal":"Dinner","name":"Chicken momos x16 + sauce","kcal":765,"protein":58,"fat":12,"sat":3}]},
    {"date":"2026-07-25","label":"Sat 25 Jul","workout":"Rest (event day)","items":[
      {"meal":"Breakfast","name":"Burger King Long Chicken","kcal":470,"protein":18,"fat":23,"sat":6},
      {"meal":"Snack","name":"Shake + nuts + berries","kcal":285,"protein":27,"fat":13,"sat":2.5},
      {"meal":"Snack","name":"Veg pulao w/ tofu + Skyr 0%","kcal":570,"protein":28,"fat":12,"sat":2},
      {"meal":"Snack","name":"Carried shake + nuts","kcal":180,"protein":26,"fat":7,"sat":1.5},
      {"meal":"Dinner","name":"Carnival tasting menu (partial portions)","kcal":1000,"protein":58,"fat":49,"sat":22},
      {"meal":"Drink","name":"Paloma cocktail","kcal":130,"protein":0,"fat":0,"sat":0}]},
    {"date":"2026-07-26","label":"Sun 26 Jul","workout":"Rest","items":[
      {"meal":"Breakfast","name":"Clear whey + scramble (3 whole + 3 whites)","kcal":390,"protein":50,"fat":21,"sat":5.5},
      {"meal":"Lunch","name":"Watermelon, feta & pine nut salad","kcal":250,"protein":8,"fat":16,"sat":5},
      {"meal":"Snack","name":"Vanilla whey + oat milk + nuts","kcal":270,"protein":26,"fat":10,"sat":2},
      {"meal":"Dinner","name":"Prawn curry (half batch) + ghee roti","kcal":415,"protein":38,"fat":13,"sat":4}]},
    {"date":"2026-07-27","label":"Mon 27 Jul","workout":"Lower A","items":[
      {"meal":"Breakfast","name":"Morning shake + nuts + berries","kcal":255,"protein":29,"fat":10,"sat":2},
      {"meal":"Lunch","name":"White rice 120g + dal palak 250g + papad","kcal":415,"protein":18,"fat":11,"sat":1.5},
      {"meal":"Snack","name":"Clear whey 31g in water","kcal":110,"protein":26,"fat":0.7,"sat":0.5},
      {"meal":"Dinner","name":"Chicken curry (250g cooked chicken) + ghee roti","kcal":665,"protein":80,"fat":27,"sat":8.5}]},
    {"date":"2026-07-28","label":"Tue 28 Jul","workout":"Pull (PRs)","items":[
      {"meal":"Breakfast","name":"Scramble (2+2) + Awesome plant shake + nuts/berries","kcal":765,"protein":65,"fat":41,"sat":7},
      {"meal":"Lunch","name":"6 egg whites + egg curry + chicken curry 200g + ghee roti","kcal":640,"protein":57,"fat":30,"sat":8.5},
      {"meal":"Dinner","name":"Pan-seared salmon 200g raw + 1 tsp peanut oil","kcal":440,"protein":40,"fat":30,"sat":5}]},
    {"date":"2026-07-29","label":"Wed 29 Jul","workout":"Lower B","items":[
      {"meal":"Early morning","name":"Manakeesh x2 (zaatar & akkawi + spicy akkawi)","kcal":800,"protein":28,"fat":38,"sat":20},
      {"meal":"Lunch","name":"White rice 84g + Greek yogurt 0% 81g + papad","kcal":200,"protein":12,"fat":2,"sat":0.5},
      {"meal":"Snack","name":"Vanilla whey + oat milk + nuts + fruit","kcal":395,"protein":31,"fat":17,"sat":3},
      {"meal":"Dinner","name":"Chilli tofu (200g) + veg hakka noodles (312g)","kcal":755,"protein":34,"fat":31,"sat":5},
      {"meal":"Snack","name":"Clear whey 32g in 450ml water","kcal":115,"protein":27,"fat":0.7,"sat":0.5}]}
  ]
};

const EXTRA_KEY = 'foodlog_extra_v1';
let DATA = null;
let SOURCE = 'seed';

function loadExtra(){ try{ return JSON.parse(localStorage.getItem(EXTRA_KEY)) || {}; }catch(e){ return {}; } }
function saveExtra(x){ localStorage.setItem(EXTRA_KEY, JSON.stringify(x)); }

function round(n){ return Math.round(n*10)/10; }
function sum(items,k){ return items.reduce((a,b)=>a+(+b[k]||0),0); }

// merge base data.json/seed with locally added items
function merged(){
  const extra = loadExtra();
  const days = DATA.days.map(d=>({...d, items:[...d.items]}));
  const byDate = {}; days.forEach(d=>byDate[d.date]=d);
  Object.keys(extra).forEach(date=>{
    if(!byDate[date]){
      const nd = {date, label: labelFor(date), workout:'', items:[]};
      days.push(nd); byDate[date]=nd;
    }
    extra[date].forEach(it=> byDate[date].items.push({...it,_local:true}));
  });
  days.sort((a,b)=> a.date<b.date?-1:1);
  return days;
}

function labelFor(iso){
  const [y,m,d]=iso.split('-').map(Number);
  const dt=new Date(Date.UTC(y,m-1,d));
  const wd=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'][dt.getUTCDay()];
  const mo=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'][m-1];
  return `${wd} ${d} ${mo}`;
}

function meterBar(val,target,mode){
  // mode 'floor' green when >=target; 'ceil' green when <=target
  const pct=Math.min(100,Math.round(val/target*100));
  let cls,status;
  if(mode==='floor'){ cls=val>=target?'b':'b'; status=val>=target?'ok':''; }
  else { const over=val>target; cls=over?'r':'g'; status=over?'over':'ok'; }
  return {pct,cls,status};
}

function render(){
  const t=DATA.targets;
  document.getElementById('targetline').innerHTML =
    `Targets: <b>${t.kcal}</b> kcal &nbsp;·&nbsp; protein floor <b>${t.protein}g</b> &nbsp;·&nbsp; fat ceiling <b>${t.fat}g</b> &nbsp;·&nbsp; sat fat <b>${t.sat}g</b>`;

  const days = merged();

  // weekly bars
  const maxCal = Math.max(t.kcal, ...days.map(d=>sum(d.items,'kcal')))*1.05;
  const maxPro = Math.max(t.protein, ...days.map(d=>sum(d.items,'protein')))*1.05;
  const calRow=document.getElementById('wk-cal'), proRow=document.getElementById('wk-pro');
  calRow.innerHTML=''; proRow.innerHTML='';
  days.forEach(d=>{
    const c=sum(d.items,'kcal'), p=sum(d.items,'protein');
    const cc = c>t.kcal? 'var(--red)':'var(--green)';
    calRow.innerHTML += `<div class="wcol"><div class="wval">${Math.round(c)}</div>
      <div class="wbar" style="height:${Math.max(4,c/maxCal*88)}px;background:${cc}"></div>
      <div class="wlbl">${d.label.split(' ').slice(0,2).join(' ')}</div></div>`;
    const pc = p>=t.protein? 'var(--blue)':'#3a6ea5';
    proRow.innerHTML += `<div class="wcol"><div class="wval">${Math.round(p)}</div>
      <div class="wbar" style="height:${Math.max(4,p/maxPro*88)}px;background:${pc}"></div>
      <div class="wlbl">${d.label.split(' ').slice(0,2).join(' ')}</div></div>`;
  });

  // day cards (newest first)
  const wrap=document.getElementById('days'); wrap.innerHTML='';
  [...days].reverse().forEach(d=>{
    const kcal=round(sum(d.items,'kcal')), pro=round(sum(d.items,'protein')),
          fat=round(sum(d.items,'fat')), sat=round(sum(d.items,'sat')), unsat=round(fat-sat);
    const t=DATA.targets;
    const pm=meterBar(pro,t.protein,'floor'), fm=meterBar(fat,t.fat,'ceil');
    const calOver = kcal>t.kcal;
    // stacked fat bar: total scaled to the 60g ceiling, split into sat (red) + unsat (green)
    const totalW = Math.min(100, t.fat? fat/t.fat*100 : 0);
    const satW = fat>0 ? totalW*(sat/fat) : 0;
    const unsatW = fat>0 ? totalW*(unsat/fat) : 0;
    const satMarker = Math.min(100, t.sat/t.fat*100); // 15g sat position on the 60g axis

    let itemsHtml='';
    d.items.forEach((it,idx)=>{
      itemsHtml += `<div class="item">
        <div class="iname"><div class="m">${it.meal||''}</div><div class="n">${it.name}</div></div>
        <div class="imac"><b>${round(it.protein)}g P</b> · ${Math.round(it.kcal)} kcal<br>
          <span style="font-size:11px">${round(it.fat)}g fat (${round(it.sat)} sat)</span>
          ${it._local?`<span class="idel" onclick="delLocal('${d.date}',${idx})">remove</span>`:''}</div>
      </div>`;
    });

    wrap.innerHTML += `<div class="day">
      <div class="dhead">
        <div><div class="dtitle">${d.label}</div>${d.workout?`<span class="dtag">${d.workout}</span>`:''}</div>
        <div class="kcal-big ${calOver?'over':'ok'}">${Math.round(kcal)} <small>/ ${t.kcal} kcal</small></div>
      </div>
      <div class="meters">
        <div class="meter"><div class="mtop"><span class="lbl">Protein</span><span class="val ${pro>=t.protein?'ok':''}">${pro}g / ${t.protein}g floor</span></div>
          <div class="bar"><div class="fill ${pm.cls}" style="width:${pm.pct}%"></div></div></div>
        <div class="meter"><div class="mtop"><span class="lbl">Fat &nbsp;<span style="color:var(--faint)">(sat + unsat)</span></span><span class="val ${fm.status}">${fat}g / ${t.fat}g</span></div>
          <div class="bar stack">
            <div class="seg r" style="width:${satW}%"></div>
            <div class="seg g" style="width:${unsatW}%"></div>
            <div class="satmark" style="left:${satMarker}%" title="15g saturated ceiling"></div>
          </div></div>
      </div>
      <div class="fatline">
        <span><span class="dot" style="background:var(--red)"></span>Saturated <b class="${sat>t.sat?'over':''}">${sat}g</b> <span style="color:var(--faint)">/ ${t.sat}g</span></span>
        <span><span class="dot" style="background:var(--green)"></span>Unsaturated <b>${unsat}g</b></span>
      </div>
      <div class="items">${itemsHtml}</div>
      <div class="drow">
        <button class="btn sync" onclick='syncDay(${JSON.stringify(d.date)},${kcal},${pro},${fat},${sat})'>Sync to Google Health</button>
      </div>
    </div>`;
  });

  document.getElementById('srcline').textContent =
    (SOURCE==='remote'?'Live log':'Preview (embedded)') + ' · last updated ' + (DATA.updated||'');
}

// ---------- Health Connect bridge ----------
function syncDay(date,kcal,pro,fat,sat){
  if(window.HealthBridge && typeof window.HealthBridge.syncDay==='function'){
    // Android app: writes ONE nutrition record per date, overwriting on re-sync
    window.HealthBridge.syncDay(date, Math.round(kcal), pro, fat, sat);
    toast('Synced '+date+' to Google Health');
  } else {
    toast('In the Android app this writes '+Math.round(kcal)+' kcal / '+pro+'g protein to Google Health (one record for '+date+', overwrites on re-sync).');
  }
}

// ---------- add food ----------
function openAdd(){
  const sel=document.getElementById('f_day');
  const days=merged();
  sel.innerHTML = days.map(d=>`<option value="${d.date}">${d.label}</option>`).join('')
    + `<option value="__today">+ New day (today)</option>`;
  sel.value = days[days.length-1].date;
  document.getElementById('modal').classList.add('open');
}
function closeAdd(){ document.getElementById('modal').classList.remove('open'); }

function todayISO(){
  const d=new Date();
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
}
function saveFood(){
  let date=document.getElementById('f_day').value;
  if(date==='__today') date=todayISO();
  const item={
    meal:document.getElementById('f_meal').value,
    name:document.getElementById('f_name').value.trim()||'Food',
    kcal:+document.getElementById('f_kcal').value||0,
    protein:+document.getElementById('f_pro').value||0,
    fat:+document.getElementById('f_fat').value||0,
    sat:+document.getElementById('f_sat').value||0
  };
  const extra=loadExtra();
  (extra[date]=extra[date]||[]).push(item);
  saveExtra(extra);
  ['f_name','f_kcal','f_pro','f_fat','f_sat'].forEach(id=>document.getElementById(id).value='');
  closeAdd(); render(); toast('Added to '+labelFor(date));
}
function delLocal(date,globalIdx){
  // globalIdx is index within merged day; local items are appended after base items
  const base = (DATA.days.find(x=>x.date===date)||{items:[]}).items.length;
  const localIdx = globalIdx-base;
  const extra=loadExtra();
  if(extra[date] && localIdx>=0){ extra[date].splice(localIdx,1); if(!extra[date].length) delete extra[date]; saveExtra(extra); render(); }
}

let toastTimer;
function toast(msg){
  const el=document.getElementById('toast'); el.textContent=msg; el.classList.add('show');
  clearTimeout(toastTimer); toastTimer=setTimeout(()=>el.classList.remove('show'),3500);
}

// ---------- boot ----------
async function boot(){
  try{
    const r=await fetch('data.json?cb='+Date.now(),{cache:'no-store'});
    if(r.ok){ DATA=await r.json(); SOURCE='remote'; }
    else throw new Error('no remote');
  }catch(e){ DATA=SEED; SOURCE='seed'; }
  render();
}
boot();
</script>
</body>
</html>
